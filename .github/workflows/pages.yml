# Builds the full site (models downloaded from OpenMMLab and SHA-256 checked,
# ONNX Runtime + three.js vendored from npm) and publishes it to GitHub Pages.
# One-time setup: Settings → Pages → Source: "GitHub Actions".
name: Deploy site

on:
  push:
    branches: [ccr-a3ca4f0c-9zoyd0, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run setup
      - run: npm test
      - run: node tools/build-site.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
